name: Voice2028

options:
  bundleIdPrefix: com.miketoryan
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.3"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  KeyboardKit:
    url: https://github.com/KeyboardKit/KeyboardKit.git
    revision: 2515c422efcd96cd5c9a78a1c8da736eb9640dc4

targets:
  Voice2028:
    type: application
    platform: iOS
    sources:
      - path: VoiceKey
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miketoryan.Voice2028
        PRODUCT_NAME: Voice2028
        INFOPLIST_FILE: VoiceKey/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: Voice2028Keyboard
        embed: true

  Voice2028Keyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: VoiceKeyKeyboard
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miketoryan.Voice2028.Keyboard
        PRODUCT_NAME: Voice2028Keyboard
        INFOPLIST_FILE: VoiceKeyKeyboard/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: KeyboardKit
        product: KeyboardKitHostPlugin

schemes:
  Voice2028:
    build:
      targets:
        Voice2028: all
        Voice2028Keyboard: all
    run:
      config: Debug
