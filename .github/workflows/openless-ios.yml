name: Build OpenLess iOS unsigned IPA
# OpenLess iOS keyboard adapter revision: 2

concurrency:
  group: openless-ios-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - openless-ios
    paths:
      - ".github/workflows/openless-ios.yml"
      - "openless-ios/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout OpenLess beta
        uses: actions/checkout@v4
        with:
          repository: Open-Less/openless
          ref: beta
          path: upstream
          submodules: recursive
          fetch-depth: 1

      - name: Checkout iOS adapter branch
        uses: actions/checkout@v4
        with:
          repository: miketoryan/Voice2028
          ref: openless-ios
          path: adapter
          fetch-depth: 1

      - name: Checkout VoiceKing GPT reference
        uses: actions/checkout@v4
        with:
          repository: miketoryan/VoiceKing
          ref: main
          path: voiceking-ref
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: upstream/openless-all/app/package-lock.json

      - name: Setup Rust iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Prepare iOS-only Tauri config
        working-directory: upstream/openless-all/app
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("src-tauri/tauri.conf.json")
          data = json.loads(p.read_text())

          # Keep OpenLess core/UI intact; only remove desktop-only build assumptions
          # from this ephemeral iOS build.
          data["version"] = "2.0.0"
          data["identifier"] = "com.miketoryan.VoiceKey"
          data.setdefault("build", {})["beforeBuildCommand"] = "npm run build"

          # iOS uses one normal main window; the desktop floating capsule is not
          # a separate iOS window.
          windows = data.setdefault("app", {}).get("windows", [])
          if windows:
              main = dict(windows[0])
              main["visible"] = True
              main["transparent"] = False
              main["decorations"] = True
              data["app"]["windows"] = [main]

          bundle = data.setdefault("bundle", {})
          bundle["iOS"] = {
              "minimumSystemVersion": "17.0",
              "bundleVersion": "20260925",
              "infoPlist": "Info.plist"
          }

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")

          # Reuse the already-registered VoiceKey host settings so AltServer
          # does not consume another App ID.
          import plistlib
          info = Path("src-tauri/Info.plist")
          with info.open("rb") as fh:
              plist = plistlib.load(fh)
          plist["NSMicrophoneUsageDescription"] = "OpenLess needs microphone access for voice dictation."
          plist["UIBackgroundModes"] = ["audio"]
          plist["CFBundleURLTypes"] = [{
              "CFBundleURLName": "VoiceKey OAuth",
              "CFBundleURLSchemes": ["voicekey", "openless", "voiceking"]
          }]
          with info.open("wb") as fh:
              plistlib.dump(plist, fh, sort_keys=False)
          PY

      - name: Add minimal iOS text insertion bridge
        working-directory: upstream/openless-all/app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src-tauri/src/insertion.rs")
          text = p.read_text()
          needle = '''    /// 只写剪贴板、不模拟粘贴。用于目标控件活跃状态无法验证时的兜底路径。\n    pub fn copy_fallback(&self, text: &str) -> InsertStatus {'''
          bridge = '''    /// iOS host: there is no desktop-style global paste target.\n    /// Keep the shared dictation pipeline compilable; a Keyboard Extension / App Group\n    /// adapter will own final text insertion on iPhone.\n    #[cfg(target_os = "ios")]\n    pub fn insert(\n        &self,\n        text: &str,\n        _restore_clipboard_after_paste: bool,\n        _paste_shortcut: PasteShortcut,\n    ) -> InsertStatus {\n        if text.is_empty() {\n            return InsertStatus::CopiedFallback;\n        }\n        InsertStatus::CopiedFallback\n    }\n\n    /// 只写剪贴板、不模拟粘贴。用于目标控件活跃状态无法验证时的兜底路径。\n    pub fn copy_fallback(&self, text: &str) -> InsertStatus {'''
          if needle not in text:
              raise SystemExit("iOS insertion patch anchor not found")
          p.write_text(text.replace(needle, bridge, 1))
          PY

      - name: Install frontend dependencies
        working-directory: upstream/openless-all/app
        run: npm ci

      - name: Ensure Tauri CLI supports unsigned iOS builds
        working-directory: upstream/openless-all/app
        run: npm install --no-save @tauri-apps/cli@2.11.0

      - name: Initialize iOS Xcode project
        working-directory: upstream/openless-all/app
        env:
          CI: "true"
        run: npx tauri ios init --ci

      - name: Add ChatGPT login bridge only
        working-directory: upstream/openless-all/app
        shell: bash
        run: |
          set -euo pipefail

          GEN_APPLE="src-tauri/gen/apple"
          SRC_DIR="$GITHUB_WORKSPACE/adapter/openless-ios/OpenLessVoiceHost"
          HOST_DIR="$GEN_APPLE/OpenLessVoiceHost"
          mkdir -p "$HOST_DIR"

          # Keep only login + credential synchronization. Recording/transcription
          # remains owned by OpenLess' native pipeline.
          cp "$SRC_DIR/OpenLessVoiceBootstrap.swift" "$HOST_DIR/OpenLessVoiceBootstrap.swift"
          cp "$SRC_DIR/OpenLessVoiceBootstrap.m" "$HOST_DIR/OpenLessVoiceBootstrap.m"
          cp "$GITHUB_WORKSPACE/voiceking-ref/VoiceKey/Services/ChatGPTAuthManager.swift" "$HOST_DIR/ChatGPTAuthManager.swift"
          cp "$GITHUB_WORKSPACE/voiceking-ref/VoiceKey/Services/KeychainStore.swift" "$HOST_DIR/KeychainStore.swift"
          cp "$GITHUB_WORKSPACE/voiceking-ref/VoiceKey/Services/OAuthCallbackServer.swift" "$HOST_DIR/OAuthCallbackServer.swift"

          gem install xcodeproj --no-document

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'src-tauri/gen/apple/openless.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          main_target = project.targets.find { |t| t.name == 'openless_iOS' }
          abort('OpenLess iOS target not found') unless main_target

          group = project.main_group.groups.find { |g| g.display_name == 'OpenLessVoiceHost' }
          group ||= project.main_group.new_group('OpenLessVoiceHost', 'OpenLessVoiceHost')

          source_names = Dir.glob('src-tauri/gen/apple/OpenLessVoiceHost/*.{swift,m}').map { |p| File.basename(p) }.sort
          refs = {}
          source_names.each do |name|
            ref = group.files.find { |f| f.path == name }
            ref ||= group.new_file(name)
            refs[name] = ref
          end

          existing = main_target.source_build_phase.files_references
          refs.each_value do |ref|
            main_target.source_build_phase.add_file_reference(ref, true) unless existing.include?(ref)
          end

          main_target.build_configurations.each do |config|
            config.build_settings['SWIFT_VERSION'] = '6.0'
            config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '17.0'
          end

          project.save
          RUBY

      - name: Add GPT providers to OpenLess AI service
        working-directory: upstream/openless-all/app
        shell: bash
        run: |
          set -euo pipefail

          cp "$GITHUB_WORKSPACE/adapter/openless-ios/OpenLessProviders/ChatGPTAsrProvider.rs"              "src-tauri/src/chatgpt_asr.rs"

          python3 - <<'PY'
          import json
          from pathlib import Path

          # 1) Register the iOS-only ASR module.
          p = Path("src-tauri/src/lib.rs")
          text = p.read_text()
          anchor = "mod core_adapters;\n"
          addition = 'mod core_adapters;\n#[cfg(target_os = "ios")]\nmod chatgpt_asr;\n'
          if addition not in text:
              if anchor not in text:
                  raise SystemExit("lib.rs core_adapters anchor missing")
              text = text.replace(anchor, addition, 1)
          p.write_text(text)

          # 2) Register GPT ASR in OpenLess' existing TranscriptionRouter.
          p = Path("src-tauri/src/core_adapters.rs")
          text = p.read_text()
          if 'ChatGptOAuthTranscriptionEngine::new()' not in text:
              loop_pos = text.find("for provider_type in openless_core::SHARED_CLOUD_ASR_PROVIDER_TYPES")
              if loop_pos < 0:
                  raise SystemExit("core_adapters ASR registration loop missing")
              end_marker = '.expect("built-in ASR provider ids are non-empty");'
              marker_pos = text.find(end_marker, loop_pos)
              if marker_pos < 0:
                  raise SystemExit("core_adapters ASR registration terminator missing")
              close_pos = text.find("\n    }", marker_pos + len(end_marker))
              if close_pos < 0:
                  raise SystemExit("core_adapters ASR registration closing brace missing")
              insert_pos = close_pos + len("\n    }")
              addition = '''
              #[cfg(target_os = "ios")]
              {
                  let chatgpt_asr: Arc<dyn TranscriptionEngine> =
                      Arc::new(crate::chatgpt_asr::ChatGptOAuthTranscriptionEngine::new());
                  transcription
                      .register(crate::chatgpt_asr::PROVIDER_ID, chatgpt_asr)
                      .expect("ChatGPT OAuth ASR provider id is non-empty");
              }'''
              text = text[:insert_pos] + addition + text[insert_pos:]
          p.write_text(text)

          # 3) Add GPT ASR to Core provider descriptors and relabel Codex OAuth
          # as the user-facing GPT smart-cleanup LLM channel.
          p = Path("crates/openless-core/src/provider_rules.rs")
          text = p.read_text()
          text = text.replace(
              'const ASR_PROVIDER_TYPES: &[(&str, &str)] = &[\n',
              'const ASR_PROVIDER_TYPES: &[(&str, &str)] = &[\n    ("chatgpt_oauth", "asrChatGPT"),\n',
              1,
          )
          text = text.replace(
              '(crate::polish::CODEX_OAUTH_PROVIDER_ID, "codexOAuth"),',
              '(crate::polish::CODEX_OAUTH_PROVIDER_ID, "codexOAuth"),',
              1,
          )
          text = text.replace(
              '                "volcengine" => AuthRequirement::Volcengine,\n',
              '                "chatgpt_oauth" => AuthRequirement::OAuth,\n                "volcengine" => AuthRequirement::Volcengine,\n',
              1,
          )
          text = text.replace(
              '                "volcengine" | XFYUN_PROVIDER_ID | TENCENT_CLOUD_PROVIDER_ID => {\n',
              '                "chatgpt_oauth" => ValidationProbe::Unsupported,\n                "volcengine" | XFYUN_PROVIDER_ID | TENCENT_CLOUD_PROVIDER_ID => {\n',
              1,
          )
          text = text.replace(
              '        "elevenlabs" => Some(crate::asr::elevenlabs::DEFAULT_MODEL),\n',
              '        "chatgpt_oauth" => Some("chatgpt-transcribe"),\n        "elevenlabs" => Some(crate::asr::elevenlabs::DEFAULT_MODEL),\n',
              1,
          )
          p.write_text(text)

          # 4) Mark the GPT ASR channel configured from the same Codex/ChatGPT OAuth file.
          p = Path("src-tauri/src/commands/credentials.rs")
          text = p.read_text()
          if 'provider == "chatgpt_oauth"' not in text:
              fn_pos = text.find("fn asr_configured_for_provider_with_model_store(")
              if fn_pos < 0:
                  raise SystemExit("credentials ASR configured function missing")
              body_pos = text.find("{", fn_pos)
              if body_pos < 0:
                  raise SystemExit("credentials ASR configured body missing")
              addition = '''
              if provider == "chatgpt_oauth" {
                  return CodexOAuthCredentials::load_default().is_ok();
              }
          '''
              text = text[:body_pos + 1] + addition + text[body_pos + 1:]
          p.write_text(text)

          # 5) Keep OpenLess' channel UI. OAuth channels simply show the shared-login notice;
          # no API key / endpoint fields are introduced.
          p = Path("src/pages/settings/ProvidersSection.tsx")
          text = p.read_text()
          text = text.replace(
              "  ['codex_oauth', 'codexOAuth'],",
              "  ['codex_oauth', 'codexOAuth'],",
              1,
          )
          if "settings.providers.chatgptOAuthNotice" not in text:
              oauth_anchor = "  if (descriptor?.authRequirement === 'none') {"
              anchor_pos = text.find(oauth_anchor)
              if anchor_pos < 0:
                  raise SystemExit("ProvidersSection local-provider branch missing")
              oauth_block = """  if (descriptor?.authRequirement === 'o_auth') {
            return (
              <div style={{ fontSize: 11.5, color: 'var(--ol-ink-4)', lineHeight: 1.6 }}>
                {t('settings.providers.codexOAuthNotice')}
              </div>
            );
          }

          """
              text = text[:anchor_pos] + oauth_block + text[anchor_pos:]
          p.write_text(text)

          # 6) Localized labels only; preserve OpenLess' existing translation keys.
          locale_files = list(Path("src/i18n").glob("*.ts"))
          for q in locale_files:
              body = q.read_text()

              # Reuse the existing codexOAuth key so every locale remains type-compatible.
              if q.name == "zh-CN.ts":
                  body = body.replace(
                      "codexOAuth: 'Codex OAuth',",
                      "codexOAuth: 'GPT 智能整理',",
                      1,
                  )
                  body = body.replace(
                      "codexOAuthNotice:\n        'Codex OAuth 使用本机 Codex 登录状态（~/.codex/auth.json），无需在 OpenLess 中保存 API Key 或 Base URL。',",
                      "codexOAuthNotice:\n        '使用当前 ChatGPT 登录状态，无需填写 API Key 或服务地址。',",
                      1,
                  )
                  asr_label = "GPT 语音识别"
              elif q.name == "zh-TW.ts":
                  asr_label = "GPT 語音識別"
              else:
                  asr_label = "GPT Speech Recognition"

              # New ASR label must exist in every locale because i18n objects are structurally typed.
              if "asrChatGPT:" not in body:
                  marker = "asrVolcengine:"
                  pos = body.find(marker)
                  if pos < 0:
                      raise SystemExit(f"{q}: asrVolcengine translation anchor missing")
                  line_start = body.rfind("\n", 0, pos) + 1
                  indent = body[line_start:pos]
                  body = body[:line_start] + f"{indent}asrChatGPT: '{asr_label}',\n" + body[line_start:]

              q.write_text(body)

          # 7) Keep the generated frontend descriptor snapshot consistent with Core.
          q = Path("src/lib/ipc/provider-descriptors.generated.json")
          data = json.loads(q.read_text())
          if not any(item.get("providerType") == "chatgpt_oauth" for item in data["asr"]):
              data["asr"].insert(0, {
                  "authRequirement": "o_auth",
                  "defaultEndpoint": None,
                  "defaultModel": "chatgpt-transcribe",
                  "defaultRequestFormat": None,
                  "kind": "asr",
                  "labelKey": "asrChatGPT",
                  "providerType": "chatgpt_oauth",
                  "staticModels": [],
                  "supportedRequestFormats": [],
                  "validationProbe": "unsupported",
              })
          for item in data["llm"]:
              if item.get("providerType") == "codex_oauth":
                  item["labelKey"] = "codexOAuth"
          q.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Add OpenLess original-style iOS keyboard extension
        working-directory: upstream/openless-all/app
        shell: bash
        run: |
          set -euo pipefail

          GEN_APPLE="src-tauri/gen/apple"
          SRC_DIR="$GITHUB_WORKSPACE/adapter/openless-ios/OpenLessKeyboard"
          EXT_DIR="$GEN_APPLE/OpenLessKeyboard"
          mkdir -p "$EXT_DIR"

          cp "$SRC_DIR/KeyboardViewController.swift" "$EXT_DIR/KeyboardViewController.swift"
          cp "$SRC_DIR/Info.plist" "$EXT_DIR/Info.plist"
          cp "$GITHUB_WORKSPACE/voiceking-ref/Shared/SharedBridge.swift" "$EXT_DIR/SharedBridge.swift"

          # Reuse OpenLess' own keyboard assets/dictionaries instead of VoiceKey assets.
          cp "$GITHUB_WORKSPACE/upstream/openless-all/app/android/assets/openless_wordmark.png" "$EXT_DIR/openless_wordmark.png"
          cp "$GITHUB_WORKSPACE/upstream/openless-all/app/android/assets/stroke.dict.tsv" "$EXT_DIR/stroke.dict.tsv"
          cp "$GITHUB_WORKSPACE/upstream/openless-all/app/android/assets/stroke-frequency.tsv" "$EXT_DIR/stroke-frequency.tsv"
          cp "$GITHUB_WORKSPACE/upstream/openless-all/app/android/assets/phrases.dict.tsv" "$EXT_DIR/phrases.dict.tsv"

          gem install xcodeproj --no-document

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'src-tauri/gen/apple/openless.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          main_target = project.targets.find { |t| t.name == 'openless_iOS' }
          abort('OpenLess iOS target not found') unless main_target

          ext_target = project.targets.find { |t| t.name == 'OpenLessKeyboard' }
          ext_target ||= project.new_target(:app_extension, 'OpenLessKeyboard', :ios, '17.0')

          group = project.main_group.groups.find { |g| g.display_name == 'OpenLessKeyboard' }
          group ||= project.main_group.new_group('OpenLessKeyboard', 'OpenLessKeyboard')

          refs = {}
          %w[
            KeyboardViewController.swift
            SharedBridge.swift
            Info.plist
            openless_wordmark.png
            stroke.dict.tsv
            stroke-frequency.tsv
            phrases.dict.tsv
          ].each do |name|
            ref = group.files.find { |f| f.path == name }
            ref ||= group.new_file(name)
            refs[name] = ref
          end

          source_refs = [
            refs['KeyboardViewController.swift'],
            refs['SharedBridge.swift']
          ]
          existing_sources = ext_target.source_build_phase.files_references
          source_refs.each do |source_ref|
            unless existing_sources.include?(source_ref)
              ext_target.source_build_phase.add_file_reference(source_ref, true)
            end
          end

          %w[
            openless_wordmark.png
            stroke.dict.tsv
            stroke-frequency.tsv
            phrases.dict.tsv
          ].each do |name|
            ref = refs[name]
            unless ext_target.resources_build_phase.files_references.include?(ref)
              ext_target.resources_build_phase.add_file_reference(ref, true)
            end
          end

          ext_target.build_configurations.each do |config|
            s = config.build_settings
            s['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.miketoryan.VoiceKey.Keyboard'
            s['PRODUCT_NAME'] = 'OpenLessKeyboard'
            s['INFOPLIST_FILE'] = 'OpenLessKeyboard/Info.plist'
            s['GENERATE_INFOPLIST_FILE'] = 'NO'
            s['SWIFT_VERSION'] = '6.0'
            s['APPLICATION_EXTENSION_API_ONLY'] = 'YES'
            s['SKIP_INSTALL'] = 'YES'
            s['IPHONEOS_DEPLOYMENT_TARGET'] = '17.0'
            s['CODE_SIGNING_ALLOWED'] = 'NO'
            s['CODE_SIGNING_REQUIRED'] = 'NO'
          end

          unless main_target.dependencies.any? { |d| d.target == ext_target }
            main_target.add_dependency(ext_target)
          end

          embed = main_target.copy_files_build_phases.find { |p| p.name == 'Embed App Extensions' }
          embed ||= main_target.new_copy_files_build_phase('Embed App Extensions')
          embed.dst_subfolder_spec = '13'

          unless embed.files_references.include?(ext_target.product_reference)
            build_file = embed.add_file_reference(ext_target.product_reference, true)
            build_file.settings = { 'ATTRIBUTES' => ['RemoveHeadersOnCopy'] }
          end

          project.save
          RUBY

          echo "Injected targets:"
          xcodebuild -project "$GEN_APPLE/openless.xcodeproj" -list

      - name: Smoke-build OpenLess keyboard extension
        working-directory: upstream/openless-all/app
        shell: bash
        run: |
          xcodebuild \
            -project src-tauri/gen/apple/openless.xcodeproj \
            -target OpenLessKeyboard \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Build unsigned iOS IPA
        working-directory: upstream/openless-all/app
        env:
          CI: "true"
        run: npx tauri ios build --no-sign --ci

      - name: Collect IPA and archive
        if: always()
        shell: bash
        run: |
          mkdir -p artifact
          find upstream/openless-all/app/src-tauri/gen/apple/build -type f \( -name "*.ipa" -o -name "*.xcarchive" \) -maxdepth 5 -print 2>/dev/null || true
          IPA="$(find upstream/openless-all/app/src-tauri/gen/apple/build -type f -name "*.ipa" -print -quit 2>/dev/null || true)"
          if [ -n "$IPA" ]; then
            cp "$IPA" artifact/OpenLess-iOS-GPT-Providers.ipa

            VERIFY_DIR="$RUNNER_TEMP/openless-verify"
            rm -rf "$VERIFY_DIR"
            mkdir -p "$VERIFY_DIR"
            unzip -q "$IPA" -d "$VERIFY_DIR"

            APP_PATH="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name "*.app" -print -quit)"
            test -n "$APP_PATH"
            test -d "$APP_PATH/PlugIns/OpenLessKeyboard.appex"

            APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
            KEYBOARD_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/PlugIns/OpenLessKeyboard.appex/Info.plist")
            EXT_POINT=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APP_PATH/PlugIns/OpenLessKeyboard.appex/Info.plist")
            KEYBOARD_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/PlugIns/OpenLessKeyboard.appex/Info.plist")

            echo "Main bundle: $APP_ID"
            echo "Keyboard bundle: $KEYBOARD_ID"
            echo "Keyboard display name: $KEYBOARD_NAME"
            echo "Extension point: $EXT_POINT"

            test "$APP_ID" = "com.miketoryan.VoiceKey"
            test "$KEYBOARD_ID" = "com.miketoryan.VoiceKey.Keyboard"
            test "$KEYBOARD_NAME" = "OpenLess"
            test "$EXT_POINT" = "com.apple.keyboard-service"
          fi
          if [ -d upstream/openless-all/app/src-tauri/gen/apple/build ]; then
            tar -czf artifact/openless-ios-build-tree.tgz -C upstream/openless-all/app/src-tauri/gen/apple build || true
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenLess-iOS-GPT-Providers
          path: artifact/
          if-no-files-found: warn
          retention-days: 14
