name: Publish OpenLess IPA direct download

on:
  workflow_run:
    workflows:
      - Build OpenLess iOS unsigned IPA
    branches:
      - openless-ios
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve successful iOS build run
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            RUN_ID="$EVENT_RUN_ID"
          else
            RUN_ID="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow openless-ios.yml \
              --branch openless-ios \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download the verified IPA artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.build.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name OpenLess-iOS-GPT-Providers \
            --dir release
          test -f release/OpenLess-iOS-GPT-Providers.ipa

      - name: Publish stable direct-download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="openless-ios-gpt-asr"
          IPA="release/OpenLess-iOS-GPT-Providers.ipa"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$IPA" \
              --repo "$GITHUB_REPOSITORY" \
              --target openless-ios \
              --title "OpenLess iOS GPT ASR" \
              --notes "Unsigned OpenLess iOS IPA with the native GPT ASR channel. Sign and install with AltStore or AltServer." \
              --prerelease
          fi
